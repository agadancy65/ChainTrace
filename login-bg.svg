<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#1a2740"/>
      <stop offset="45%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#080d18"/>
    </radialGradient>

    <linearGradient id="amberLink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb648"/>
      <stop offset="55%" stop-color="#d98a1f"/>
      <stop offset="100%" stop-color="#8a5008"/>
    </linearGradient>

    <linearGradient id="tealLink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fd6c4"/>
      <stop offset="100%" stop-color="#0f6d63"/>
    </linearGradient>

    <linearGradient id="dimLink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3550"/>
      <stop offset="100%" stop-color="#1a2338"/>
    </linearGradient>

    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#1c2740" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1600" height="1000" fill="url(#bgGlow)"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.55"/>

  <!-- Radiating scan lines for energy -->
  <g opacity="0.12" stroke="#d98a1f" stroke-width="1.5">
    <line x1="0" y1="0" x2="1600" y2="1000"/>
    <line x1="200" y1="0" x2="1600" y2="800"/>
    <line x1="0" y1="200" x2="1400" y2="1000"/>
    <line x1="0" y1="400" x2="1200" y2="1000"/>
    <line x1="400" y1="0" x2="1600" y2="600"/>
  </g>

  <!-- Background dim chain, top-left sweep, adds depth -->
  <g stroke="url(#dimLink)" stroke-width="20" fill="none" opacity="0.55">
    <ellipse cx="-40" cy="120" rx="95" ry="58" transform="rotate(28 -40 120)"/>
    <ellipse cx="90" cy="60" rx="95" ry="58" transform="rotate(-28 90 60)"/>
    <ellipse cx="220" cy="130" rx="95" ry="58" transform="rotate(28 220 130)"/>
    <ellipse cx="330" cy="60" rx="95" ry="58" transform="rotate(-28 330 60)"/>
    <ellipse cx="460" cy="130" rx="95" ry="58" transform="rotate(28 460 130)"/>
  </g>

  <!-- Teal secondary chain, lower-left, crossing behind -->
  <g stroke="url(#tealLink)" stroke-width="18" fill="none" opacity="0.5" filter="url(#softGlow)">
    <ellipse cx="60" cy="820" rx="88" ry="54" transform="rotate(-30 60 820)"/>
    <ellipse cx="190" cy="900" rx="88" ry="54" transform="rotate(30 190 900)"/>
    <ellipse cx="330" cy="850" rx="88" ry="54" transform="rotate(-30 330 850)"/>
    <ellipse cx="470" cy="920" rx="88" ry="54" transform="rotate(30 470 920)"/>
  </g>

  <!-- MAIN amber chain — big, bold, full diagonal sweep, hero element -->
  <g filter="url(#strongGlow)">
    <g stroke="url(#amberLink)" stroke-width="26" fill="none">
      <ellipse cx="950" cy="-30" rx="110" ry="68" transform="rotate(34 950 -30)"/>
      <ellipse cx="1110" cy="90" rx="110" ry="68" transform="rotate(-34 1110 90)"/>
      <ellipse cx="1230" cy="240" rx="110" ry="68" transform="rotate(34 1230 240)"/>
      <ellipse cx="1310" cy="410" rx="110" ry="68" transform="rotate(-34 1310 410)"/>
      <ellipse cx="1350" cy="590" rx="110" ry="68" transform="rotate(34 1350 590)"/>
      <ellipse cx="1330" cy="770" rx="110" ry="68" transform="rotate(-34 1330 770)"/>
      <ellipse cx="1260" cy="930" rx="110" ry="68" transform="rotate(34 1260 930)"/>
      <ellipse cx="1150" cy="1040" rx="110" ry="68" transform="rotate(-34 1150 1040)"/>
    </g>
    <animateTransform attributeName="transform" type="scale" values="1;1.015;1" dur="4s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- Pulsing glow behind the broken link, to draw the eye -->
  <circle cx="1270" cy="415" r="70" fill="#3fd6c4" opacity="0.25" filter="url(#softGlow)">
    <animate attributeName="r" values="60;95;60" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Broken link — tamper-evidence motif, mid-chain -->
  <g stroke="#effaf3" stroke-width="8" fill="none">
    <path d="M 1330 470 A 55 34 0 1 1 1230 415"/>
  </g>
  <circle cx="1230" cy="415" r="7" fill="#3fd6c4">
    <animate attributeName="r" values="6;9;6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1330" cy="470" r="7" fill="#3fd6c4">
    <animate attributeName="r" values="6;9;6" dur="1.8s" repeatCount="indefinite" begin="0.4s"/>
  </circle>

  <!-- Drifting spark particles for liveliness -->
  <g fill="#ffcf7d">
    <circle cx="200" cy="300" r="3">
      <animate attributeName="cy" values="300;260;300" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="150" r="2.5">
      <animate attributeName="cy" values="150;110;150" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1500" cy="200" r="3">
      <animate attributeName="cy" values="200;250;200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="650" r="2">
      <animate attributeName="cy" values="650;600;650" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="700" r="2.5">
      <animate attributeName="cy" values="700;650;700" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1450" cy="750" r="3">
      <animate attributeName="cy" values="750;800;750" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Scattered hash / evidence-tag text for texture and story -->
  <g font-family="SFMono-Regular, Consolas, monospace" font-size="16" fill="#d98a1f" opacity="0.4">
    <text x="60" y="560">SHA256: 0d8a3fdd9150...</text>
    <text x="900" y="70">entry: c42489f76531...</text>
    <text x="70" y="960">prev: af12c908e3a4...</text>
    <text x="1000" y="960">MATCH: verified ✓</text>
  </g>

  <!-- Left-side readability vignette for the login card -->
  <radialGradient id="cardVignette" cx="26%" cy="52%" r="55%">
    <stop offset="0%" stop-color="#080d18" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#080d18" stop-opacity="0"/>
  </radialGradient>
  <rect width="1600" height="1000" fill="url(#cardVignette)"/>
</svg>
